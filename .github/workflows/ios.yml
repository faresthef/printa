# Compile un .ipa non signé sur un Mac GitHub, à installer ensuite avec Sideloadly / AltStore.
name: iOS (.ipa non signé)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Printa.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Printa-ipa, path: Printa.ipa }
