# Compile un .ipa non signé sur un Mac GitHub, à installer ensuite avec Sideloadly / AltStore.
name: iOS (.ipa non signé)
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Printa.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Printa-ipa, path: Printa.ipa }
      # Lien direct stable : https://github.com/<compte>/printa/releases/latest/download/Printa.ipa
      - name: Publier dans la release « latest »
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Printa.ipa --title "Printa (dernière version)" --notes "Installe Printa.ipa avec Sideloadly." --target "$GITHUB_SHA"
